<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>🐾 Companion Arena</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0a0a0a; }
    #arena { width: 100vw; height: 100vh; }
    .pixel-arena-canvas {
      width: 100%; height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #mini-titlebar {
      position: absolute; top: 0; left: 0; right: 0; height: 24px;
      -webkit-app-region: drag;
      background: rgba(10,10,20,0.6);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 8px; z-index: 10;
    }
    #mini-titlebar span {
      font-family: 'Orbitron', monospace; font-size: 10px; color: rgba(255,153,0,0.7);
    }
    .mini-close {
      -webkit-app-region: no-drag;
      background: none; border: none; color: #888; font-size: 14px; cursor: pointer;
      padding: 0 4px;
    }
    .mini-close:hover { color: #ff4444; }
  </style>
</head>
<body>
  <div id="mini-titlebar">
    <span>🐾 Companion Arena</span>
    <button class="mini-close" onclick="window.close()">✕</button>
  </div>
  <div id="arena"></div>

  <script>
    const _path = require('path');
    window._assetsDir = _path.join(__dirname, 'assets');

    require(_path.join(__dirname, 'js', 'companion-renderer.js'));
    require(_path.join(__dirname, 'js', 'pixel-arena.js'));

    const urlParams = new URLSearchParams(window.location.search);
    const state = JSON.parse(urlParams.get('state') || '{}');

    const arena = new PixelArena(document.getElementById('arena'));

    if (state.bgPath) arena.setBackground(state.bgPath);
    if (state.horizonLine) arena.horizonLine = state.horizonLine;

    (async () => {
      if (state.companionId) {
        await arena.setCompanion(state.companionAgentId, state.companionId, state.companionName);
      }
    })();

    // Listen for companion changes from main process
    const { ipcRenderer } = require('electron');
    console.log('[Companion Window] Setting up listener... ipcRenderer:', !!ipcRenderer);
    if (ipcRenderer) {
      console.log('[Companion Window] Registering companion-changed listener');
      ipcRenderer.on('companion-changed', async (event, { companionId }) => {
        console.log('[Companion Window] ===== RECEIVED companion-changed: ' + companionId + ' =====');
        state.companionId = companionId;
        console.log('[Companion Window] Updated state.companionId to:', companionId);
        // Update the arena display
        if (arena) {
          console.log('[Companion Window] Arena exists, calling setCompanion...');
          await arena.setCompanion(state.companionAgentId, companionId, state.companionName);
          console.log('[Companion Window] setCompanion completed');
        } else {
          console.log('[Companion Window] Arena is null!');
        }
      });
      console.log('[Companion Window] Listener registered successfully');
    } else {
      console.log('[Companion Window] ERROR: ipcRenderer not available!');
    }
  </script>
</body>
</html>
